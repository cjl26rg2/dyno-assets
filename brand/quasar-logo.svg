<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Quasar: a bold Q. The ring is the disk, the dot is the bright core, and the tail is the jet: it starts
       inside the ring and cuts through it, like the tail of a Q (not a handle). Flat colours, no gradients.
       Everything sits inside the circle Yapper crops avatars to. -->
  <rect width="512" height="512" rx="120" fill="#0d1220"/>
  <circle cx="242" cy="242" r="128" fill="none" stroke="#7c6cff" stroke-width="56"/>
  <circle cx="242" cy="242" r="36" fill="#ffffff"/>
  <path d="M300 300L384 384" stroke="#0d1220" stroke-width="84" stroke-linecap="round"/>
  <path d="M300 300L384 384" stroke="#ffffff" stroke-width="50" stroke-linecap="round"/>
</svg>
